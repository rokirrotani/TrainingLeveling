<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Daily leveling loop">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .desc { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .line { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="420" fill="#eff6ff"/>
  <text x="40" y="54" class="title">Daily Leveling Loop</text>

  <rect x="70" y="120" width="200" height="120" class="node"/>
  <text x="92" y="158" class="label">Missioni giornaliere</text>
  <text x="92" y="182" class="desc">Workout, cibo, idratazione</text>

  <rect x="320" y="120" width="200" height="120" class="node"/>
  <text x="342" y="158" class="label">Calcolo XP</text>
  <text x="342" y="182" class="desc">+50, +30, +20</text>

  <rect x="570" y="120" width="200" height="120" class="node"/>
  <text x="592" y="158" class="label">Update livello</text>
  <text x="592" y="182" class="desc">Progress bar + streak</text>

  <rect x="820" y="120" width="220" height="120" class="node"/>
  <text x="842" y="158" class="label">Feedback Levellino</text>
  <text x="842" y="182" class="desc">Motivazione + prossima missione</text>

  <path d="M270 180 L320 180" class="line"/>
  <path d="M520 180 L570 180" class="line"/>
  <path d="M770 180 L820 180" class="line"/>

  <path d="M930 250 C930 330, 180 330, 180 250" class="line"/>
  <text x="430" y="355" class="desc">Il loop si ripete ogni giorno per aumentare engagement e costanza</text>
</svg>
