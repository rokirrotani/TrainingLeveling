<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Onboarding flow">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .step { fill: #f8fafc; stroke: #0ea5e9; stroke-width: 2; rx: 16; }
      .h { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .p { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .line { stroke: #0ea5e9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#e2f3ff"/>
  <text x="40" y="54" class="title">Onboarding Guidato da Levellino</text>

  <rect x="40" y="110" width="210" height="180" class="step"/>
  <text x="58" y="145" class="h">Step 1</text>
  <text x="58" y="170" class="p">Profilo base</text>
  <text x="58" y="192" class="p">Nome, eta, altezza, peso</text>

  <rect x="280" y="110" width="210" height="180" class="step"/>
  <text x="298" y="145" class="h">Step 2</text>
  <text x="298" y="170" class="p">Obiettivo</text>
  <text x="298" y="192" class="p">Fat loss, muscle gain, recomposition</text>

  <rect x="520" y="110" width="210" height="180" class="step"/>
  <text x="538" y="145" class="h">Step 3</text>
  <text x="538" y="170" class="p">Preferenze</text>
  <text x="538" y="192" class="p">Routine, pasti rapidi, home workout</text>

  <rect x="760" y="110" width="210" height="180" class="step"/>
  <text x="778" y="145" class="h">Step 4</text>
  <text x="778" y="170" class="p">Piano personalizzato</text>
  <text x="778" y="192" class="p">Allenamento + nutrizione + focus</text>

  <rect x="1000" y="110" width="160" height="180" class="step"/>
  <text x="1018" y="145" class="h">Step 5</text>
  <text x="1018" y="170" class="p">Dashboard</text>
  <text x="1018" y="192" class="p">Missioni, XP, livello</text>

  <path d="M250 200 L280 200" class="line"/>
  <path d="M490 200 L520 200" class="line"/>
  <path d="M730 200 L760 200" class="line"/>
  <path d="M970 200 L1000 200" class="line"/>
</svg>
